# ============================================================
# Zika Clash TF
# 国内直连 + 海外手动代理 + 内置去广告 + DNS 防泄漏
# ============================================================

mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false

# ============================================================
# DNS
# ============================================================

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true

  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.1.1.1/dns-query

  nameserver-policy:
    "geosite:cn":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query

    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query

  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.apple.com"
    - "+.icloud.com"
    - "+.push.apple.com"

# ============================================================
# 你的订阅
# ============================================================

proxy-providers:

  Zika-Subscription:
    type: http
    url: "YOUR_SUBSCRIPTION_URL"
    interval: 86400
    path: ./proxy_providers/zika.yaml

# ============================================================
# 手动代理
# ============================================================

proxy-groups:

  - name: "🌎 海外代理"
    type: select
    use:
      - Zika-Subscription

# ============================================================
# 内置去广告
# ============================================================

rules:

  # -------------------------
  # 常见广告/统计域名
  # -------------------------

  - DOMAIN-SUFFIX,doubleclick.net,REJECT
