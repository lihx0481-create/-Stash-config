name: Zika Nexus

# ============================================================
# Zika Nexus
# Universal Stash 3.6.x Public Configuration
#
# 设计原则：
# 1. 不内置任何机场订阅
# 2. 不内置去广告规则
# 3. 用户自行添加机场 / Proxy Provider
# 4. 自动识别节点地区
# 5. 软件 / 服务独立分流
# 6. DNS 尽量避免本地 DNS 泄漏
# 7. Tiles 仅负责网络状态检测
# ============================================================


# ============================================================
# 基础设置
# ============================================================

mode: rule

log-level: warning

ipv6: true


# ============================================================
# Proxy Providers
#
# 公开配置不写死任何机场。
#
# 用户可以：
# Stash → 配置 → 代理 / Proxy Provider
# 自行添加机场订阅。
#
# 所有策略组均使用 include-all: true，
# 因此用户加入自己的机场后会自动进入对应策略组。
# ============================================================

# proxy-providers:
#
#   example:
#     url: https://example.com/your-subscription
#     interval: 3600


# ============================================================
# Proxy Groups
# ============================================================

proxy-groups:

  # ----------------------------------------------------------
  # 总代理
  # ----------------------------------------------------------

  - name: 选择代理
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Proxy.png
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - HK 香港
      - TW 台湾
      - SG 新加坡
      - JP 日本
      - KR 韩国
      - US 美国
      - CA 加拿大
      - GB 英国
      - DE 德国
      - FR 法国
      - AU 澳大利亚
      - IN 印度
      - RU 俄罗斯
      - 其他地区
      - DIRECT


  # ----------------------------------------------------------
