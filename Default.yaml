# ============================================================
# DNS
# ============================================================

dns:

  # 用于解析 DNS 服务自身的域名
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 只保留两个上游，降低移动设备功耗
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.1.1.1/dns-query

  # 不让 DNS 请求跟随代理规则，
  # 避免 DNS → Proxy → DNS 的递归问题
  follow-rule: false

  # 兼容部分 DoH 环境
  skip-cert-verify: false

  # 国内域名使用国内 DNS，
  # 国际域名继续使用默认 DNS。
  nameserver-policy:

    "geosite:cn":
      - 223.5.5.5
      - 119.29.29.29

    "geosite:apple":
      - https://1.1.1.1/dns-query

    "geosite:google":
      - https://1.1.1.1/dns-query

    "geosite:telegram":
      - https://1.1.1.1/dns-query

    "geosite:twitter":
      - https://1.1.1.1/dns-query

    "geosite:facebook":
      - https://1.1.1.1/dns-query

    "geosite:youtube":
      - https://1.1.1.1/dns-query

  # Fake IP 排除
  fake-ip-filter:

    # STUN / WebRTC
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "+.stun.*.*.*.*.*"

    # Apple
    - "lens.l.google.com"

    # Nintendo
    - "*.n.n.srv.nintendo.net"

    # PlayStation
    - "+.stun.playstation.net"

    # Xbox
    - "+.stun.xboxlive.com"

    # WebRTC 常用
    - "+.stun.services.mozilla.com"
    - "+.stun.cloudflare.com"


# ============================================================
# Script Shortcuts
# ============================================================

script:

  shortcuts:

    # 禁用 QUIC / HTTP3 UDP 443。
    # 对部分代理协议可以明显提高稳定性。
    quic: network == 'udp' and dst_port == 443


# ============================================================
# Rules
# ============================================================

rules:

  # ----------------------------------------------------------
