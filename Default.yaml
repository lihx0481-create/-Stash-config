# ============================================================
# Tiles
# ============================================================

tiles: #!replace

  # ==========================================================
  # 01 网络质量
  # ==========================================================

  - name: tile-network-quality
    interval: 600
    title: "网络质量"
    content: "节点测速中..."
    icon: "speedometer"
    backgroundColor: "#3E315F"


  # ==========================================================
  # 02 节点健康
  # ==========================================================

  - name: tile-node-health
    interval: 600
    title: "节点健康"
    content: "节点检测中..."
    icon: "bolt.horizontal.circle.fill"
    backgroundColor: "#315D38"


  # ==========================================================
  # 03 国际出口
  # ==========================================================

  - name: tile-international
    interval: 86400
    title: "国际出口"
    content: "检测中..."
