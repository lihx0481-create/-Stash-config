# ============================================================
# Zika Stash Public Config
# 2026
#
# 公共基础配置
#
# ✓ 不包含机场订阅
# ✓ 不包含个人节点
# ✓ 自动读取用户代理
# ✓ 自动地区识别
# ✓ 自动节点测速
# ✓ 软件独立分流
# ✓ DNS
# ✓ QUIC 控制
# ✓ 网络诊断 Tiles
#
# 去广告请使用独立 .stoverride
# ============================================================


# ============================================================
# 基础
# ============================================================

mode: rule
log-level: warning


# ============================================================
# Proxy Groups
# ============================================================

proxy-groups:

  # ==========================================================
  # 主代理
  # ==========================================================

  - name: 选择代理
    type: select
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Proxy.png
    proxies:
      - 自动选择
      - 手动选择
      - HK 香港
      - TW 台湾
      - SG 新加坡
      - JP 日本
      - KR 韩国
      - US 美国
      - CA 加拿大
      - GB 英国
      - DE 德国
      - FR 法国
      - NL 荷兰
      - AU 澳大利亚
      - TR 土耳其
      - IN 印度
      - PH 菲律宾
      - DIRECT


  # ==========================================================
  # 自动选择
  # ==========================================================

  - name: 自动选择
    type: url-test
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Auto.png
    include-all: true
    interval: 300
    tolerance: 80
    lazy: true


