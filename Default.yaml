script-providers: #!replace

  tile-international:
    interval: 86400
    payload: |
      var start = Date.now();

      $httpClient.get(
        "https://ipinfo.io/json",
        function(error, response, data) {

          var ms = Date.now() - start;

          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 300
          ) {
            $done({
              content: "✕ 出口检测失败"
            });
            return;
          }

          try {
            var x = JSON.parse(data);

            $done({
              content:
                (x.ip || "Unknown") + "\n" +
                (x.country || "Unknown") +
                " · " +
                (x.city || "Unknown") + "\n" +
                (x.org || "Unknown") + "\n" +
                ms + "ms"
            });

          } catch (e) {
            $done({
              content: "✕ 数据解析失败"
            });
          }
        }
      );


  tile-network-control:
    interval: 86400
    payload: |
      var version =
        $environment["stash-version"] || "Unknown";

      var build =
        $environment["stash-build"] || "Unknown";

      $done({
        content:
          "Stash " + version + "\n" +
          "Build · " + build + "\n" +
          "Network Engine · OK"
      });


  tile-dns:
    interval: 86400
    payload: |

      var start = Date.now();
      var finished = false;

      function doneOnce(content) {

        if (finished) {
          return;
        }

        finished = true;

        $done({
          content: content
        });
      }

      setTimeout(function() {

        doneOnce(
          "✕ DNS 检测超时\n" +
          "DoH · Cloudflare\n" +
          "Resolver · 1.1.1.1\n" +
          "点击手动检测 →"
        );

      }, 6000);


      $httpClient.get(
        {
          url:
            "https://1.1.1.1/dns-query?name=example.com&type=A",

          headers: {
            "Accept": "application/dns-json"
          },

          timeout: 5
        },

        function(error, response, data) {

          if (finished) {
            return;
          }

          var ms =
            Date.now() - start;


          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 300
          ) {

            doneOnce(
              "✕ DNS 查询失败\n" +
              "DoH · Cloudflare\n" +
              "Resolver · 1.1.1.1\n" +
              "点击手动检测 →"
            );

            return;
          }


          try {

            var json =
              JSON.parse(data);

            var answers =
              json.Answer || [];


            if (answers.length === 0) {

              doneOnce(
                "⚠ DNS 查询无记录 · " +
                ms +
                "ms\n" +
                "DoH · Cloudflare\n" +
                "Resolver · 1.1.1.1\n" +
                "点击手动检测 →"
              );

              return;
            }


            var first =
              answers[0];


            doneOnce(
              "✓ DNS 查询正常 · " +
              ms +
              "ms\n" +
              "DoH · Cloudflare\n" +
              "Resolver · 1.1.1.1\n" +
              "A · " +
              first.data +
              "\n" +
              "Answer · " +
              answers.length +
              "\n" +
              "TTL · " +
              (
                first.TTL !== undefined
                  ? first.TTL + "s"
                  : "未知"
              ) +
              "\n" +
              "点击手动检测 →"
            );


          } catch (e) {

            doneOnce(
              "✕ DNS 数据解析失败\n" +
              "DoH · Cloudflare\n" +
              "点击手动检测 →"
            );

          }

        }
      );


  tile-webrtc:
    interval: 86400
    payload: |

      var start = Date.now();

      $httpClient.get(
        "https://browserleaks.com/webrtc",
        function(error, response, data) {

          var ms =
            Date.now() - start;


          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 400
          ) {

            $done({
              content:
                "✕ WebRTC 检测失败\n" +
                "点击手动检测 →"
            });

            return;
          }


          $done({
            content:
              "✓ WebRTC 服务正常 · " +
              ms +
              "ms\n" +
              "自动检测 · 可用\n" +
              "点击手动检测 →"
          });

        }
      );


  tile-tls:
    interval: 86400
    payload: |

      var start =
        Date.now();


      $httpClient.get(
        "https://www.cloudflare.com/cdn-cgi/trace",
        function(error, response, data) {

          var ms =
            Date.now() - start;


          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 400
          ) {

            $done({
              content:
                "✕ TLS 检测失败\n" +
                "HTTPS 连接不可用"
            });

            return;
          }


          var tls =
            "Unknown";

          var http =
            "Unknown";

          var colo =
            "Unknown";


          if (data) {

            var tlsMatch =
              data.match(
                /(?:^|\n)tls=([^\n]+)/
              );

            var httpMatch =
              data.match(
                /(?:^|\n)http=([^\n]+)/
              );

            var coloMatch =
              data.match(
                /(?:^|\n)colo=([^\n]+)/
              );


            if (tlsMatch) {
              tls =
                tlsMatch[1];
            }

            if (httpMatch) {
              http =
                httpMatch[1];
            }

            if (coloMatch) {
              colo =
                coloMatch[1];
            }

          }


          $done({
            content:
              "✓ TLS 正常 · " +
              ms +
              "ms\n" +
              "TLS · " +
              tls +
              "\n" +
              "HTTP · " +
              http +
              "\n" +
              "POP · " +
              colo
          });

        }
      );


  tile-network-quality:
    interval: 86400
    payload: |

      var start =
        Date.now();


      $httpClient.get(
        "https://www.cloudflare.com/cdn-cgi/trace",
        function(error, response, data) {

          var ms =
            Date.now() - start;


          if (
            error ||
            !response
          ) {

            $done({
              content:
                "✕ 网络质量检测失败"
            });

            return;
          }


          var colo =
            "Unknown";

          var loc =
            "Unknown";


          if (data) {

            var m1 =
              data.match(
                /(?:^|\n)colo=([^\n]+)/
              );

            var m2 =
              data.match(
                /(?:^|\n)loc=([^\n]+)/
              );


            if (m1) {
              colo =
                m1[1];
            }

            if (m2) {
              loc =
                m2[1];
            }

          }


          $done({
            content:
              "✓ " +
              ms +
              "ms\n" +
              "POP · " +
              colo +
              " · " +
              loc
          });

        }
      );


  tile-quic-http3:
    interval: 86400
    payload: |

      var start =
        Date.now();

      $httpClient.get(
        "https://cloudflare-quic.com/",
        function(error, response, data) {

          var ms =
            Date.now() - start;


          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 400
          ) {

            $done({
              content:
                "✕ HTTP/3 不可用\n" +
                "Endpoint · cloudflare-quic.com\n" +
                "Latency · " +
                ms +
                "ms"
            });

            return;
          }


          var alt =
            "";

          try {

            if (response.headers) {

              alt =
                response.headers["alt-svc"] ||
                response.headers["Alt-Svc"] ||
                "";

            }

          } catch (e) {}


          if (
            alt &&
            alt.toLowerCase()
              .indexOf("h3") !== -1
          ) {

            $done({
              content:
                "✓ HTTP/3 支持\n" +
                "Endpoint · cloudflare-quic.com\n" +
                "Latency · " +
                ms +
                "ms\n" +
                "Alt-Svc · h3"
            });

          } else {

            $done({
              content:
                "⚠ HTTP/3 状态未知\n" +
                "Endpoint · cloudflare-quic.com\n" +
                "Latency · " +
                ms +
                "ms\n" +
                "Alt-Svc · 未检测到 h3"
            });

          }

        }
      );


  tile-node-health:
    interval: 86400
    payload: |

      var start =
        Date.now();


      $httpClient.get(
        "https://www.apple.com/library/test/success.html",
        function(error, response, data) {

          var ms =
            Date.now() - start;


          if (
            error ||
            !response
          ) {

            $done({
              content:
                "✕ 节点不可达"
            });

            return;
          }


          if (
            response.status < 200 ||
            response.status >= 400
          ) {

            $done({
              content:
                "⚠ HTTP " +
                response.status +
                " · " +
                ms +
                "ms"
            });

            return;
          }


          var level;


          if (ms < 100) {

            level =
              "优秀";

          } else if (ms < 250) {

            level =
              "良好";

          } else if (ms < 500) {

            level =
              "一般";

          } else {

            level =
              "延迟较高";
          }


          $done({
            content:
              "✓ " +
              level +
              " · " +
              ms +
              "ms"
          });

        }
      );


  tile-youtube:
    interval: 604800
    payload: |

      var start =
        Date.now();


      $httpClient.get(
        "https://www.youtube.com/generate_204",
        function(error, response, data) {

          var ms =
            Date.now() - start;


          if (
            !error &&
            response &&
            response.status >= 200 &&
            response.status < 400
          ) {

            $done({
              icon: "checkmark",
              content:
                ms + "ms"
            });

          } else {

            $done({
              icon: "xmark",
              content:
                "不可用"
            });

          }

        }
      );


