script-providers: #!replace


  # ============================================================
  # 🛰️ 国际出口
  # ============================================================

  tile-international:
    interval: 86400
    payload: |
      var start = Date.now();

      $httpClient.get(
        "https://ipinfo.io/json",
        function(error, response, data) {

          var ms = Date.now() - start;

          if (error || !response ||
              response.status < 200 ||
              response.status >= 300) {

            $done({
              content: "出口检测失败",
              icon: "xmark.circle.fill",
              backgroundColor: "#6A2B2B"
            });

            return;
          }

          try {

            var x = JSON.parse(data);

            var ip = x.ip || "Unknown";
            var country = x.country || "Unknown";
            var city = x.city || "Unknown";
            var org = x.org || "Unknown";

            var isp = org;

            if (isp.length > 34) {
              isp = isp.substring(0, 34) + "...";
            }

            $done({
              content:
                ip + "\n" +
                country + " · " + city + "\n" +
                isp + "\n" +
                ms + "ms",
              icon: "globe.americas.fill",
              backgroundColor: "#173B5E"
            });

          } catch(e) {

            $done({
              content: "数据解析失败",
              icon: "xmark.circle.fill",
              backgroundColor: "#6A2B2B"
            });

          }

        }
      );


  # ============================================================
  # 🌐 网络控制中心
  # ============================================================

  tile-network:
    interval: 86400
    payload: |

      var version =
        $environment["stash-version"] || "Unknown";

      var build =
        $environment["stash-build"] || "Unknown";

      $done({
        content:
          "Stash " + version + "\n" +
          "Build " + build + "\n" +
          "Network Engine · OK",
        icon: "network",
        backgroundColor: "#244A3A"
      });


  # ============================================================
  # ⚡ 节点健康
  # ============================================================

  tile-node-health:
    interval: 86400
    payload: |

      var start = Date.now();

      $httpClient.get(
        "https://www.apple.com/library/test/success.html",
        function(error, response, data) {

          var ms = Date.now() - start;

          if (error || !response) {

            $done({
              content:
                "连接失败\n" +
                "节点不可达",
              icon: "xmark.octagon.fill",
              backgroundColor: "#6A2B2B"
            });

            return;
          }

          var status =
            response.status;

          if (status < 200 || status >= 400) {

            $done({
              content:
                "HTTP " + status + "\n" +
                ms + "ms",
              icon: "exclamationmark.octagon.fill",
              backgroundColor: "#8A5A20"
            });

            return;
          }

          if (ms < 100) {

            $done({
              content:
                "优秀\n" +
                ms + "ms · HTTP " + status,
              icon: "checkmark.seal.fill",
              backgroundColor: "#315D38"
            });

          } else if (ms < 250) {

            $done({
              content:
                "良好\n" +
                ms + "ms · HTTP " + status,
              icon: "checkmark.seal.fill",
              backgroundColor: "#315D38"
            });

          } else if (ms < 500) {

            $done({
              content:
                "一般\n" +
                ms + "ms · HTTP " + status,
              icon: "exclamationmark.circle.fill",
              backgroundColor: "#8A5A20"
            });

          } else {

            $done({
              content:
                "延迟较高\n" +
                ms + "ms · HTTP " + status,
              icon: "exclamationmark.triangle.fill",
              backgroundColor: "#8A5A20"
            });

          }

        }
      );


  # ============================================================
  # 📊 网络质量
  # ============================================================

  tile-network-quality:
    interval: 86400
    payload: |

      var start = Date.now();

      $httpClient.get(
        "https://www.cloudflare.com/cdn-cgi/trace",
        function(error, response, data) {

          var ms = Date.now() - start;

          if (error || !response) {

            $done({
              content: "网络质量检测失败",
              icon: "xmark.circle.fill",
              backgroundColor: "#6A2B2B"
            });

            return;
          }

          var colo = "Unknown";
          var loc = "Unknown";
          var ip = "Unknown";

          if (data) {

            var m1 =
              data.match(/(?:^|\n)colo=([^\n]+)/);

            var m2 =
              data.match(/(?:^|\n)loc=([^\n]+)/);

            var m3 =
              data.match(/(?:^|\n)ip=([^\n]+)/);

            if (m1) colo = m1[1];
            if (m2) loc = m2[1];
            if (m3) ip = m3[1];

          }

          $done({
            content:
              ms + "ms\n" +
              "POP · " + colo + " · " + loc + "\n" +
              "出口 · " + ip,
            icon: "speedometer",
            backgroundColor: "#3E315F"
          });

        }
      );


  # ============================================================
  # 🚀 QUIC / HTTP3
  # ============================================================

  tile-quic:
    interval: 86400
    payload: |

      var start = Date.now();

      $httpClient.get(
        "https://cloudflare-quic.com/",
        function(error, response, data) {

          var ms = Date.now() - start;

          if (error || !response) {

            $done({
              content:
                "HTTP/3 端点不可达",
              icon: "xmark.circle.fill",
              backgroundColor: "#6A2B2B"
            });

            return;
          }

          var alt =
            "";

          try {

            if (response.headers) {

              alt =
                response.headers["alt-svc"] ||
                response.headers["Alt-Svc"] ||
                "";

            }

          } catch(e) {}

          if (alt && alt.indexOf("h3") !== -1) {

            $done({
              content:
                "HTTP " +
                response.status +
                " · " +
                ms +
                "ms\n" +
                "Alt-Svc · h3",
              icon: "checkmark.circle.fill",
              backgroundColor: "#315D38"
            });

          } else {

            $done({
              content:
                "HTTP " +
                response.status +
                " · " +
                ms +
                "ms\n" +
                "HTTP/3 Endpoint OK",
              icon: "bolt.circle.fill",
              backgroundColor: "#164C55"
            });

          }

        }
      );


  # ============================================================
  # 🧬 3.6 协议能力
  # ============================================================

  tile-protocols:
    interval: 86400
    payload: |

      var version =
        $environment["stash-version"] ||
        "Unknown";

      var build =
        $environment["stash-build"] ||
        "Unknown";

      $done({
        content:
          "Stash " +
          version +
          "\n" +
          "XHTTP · ✓\n" +
          "Gecko · ✓\n" +
          "Build · " +
          build,
        icon:
          "point.3.connected.trianglepath.dotted",
        backgroundColor:
          "#493B63"
      });


  # ============================================================
  # 🧠 DNS
  # ============================================================

  tile-dns:
    interval: 86400
    payload: |

      var start = Date.now();

      $httpClient.get(
        "https://cloudflare-dns.com/dns-query?name=example.com&type=A",
        function(error, response, data) {

          var ms = Date.now() - start;

          if (error || !response) {

            $done({
              content:
                "DNS 请求失败",
              icon:
                "xmark.shield.fill",
              backgroundColor:
                "#6A2B2B"
            });

            return;
          }

          if (response.status >= 200 &&
              response.status < 300) {

            var answer = "OK";

            try {

              var json =
                JSON.parse(data);

              if (json.Answer &&
                  json.Answer.length > 0) {

                answer =
                  json.Answer[0].data;

              }

            } catch(e) {}

            $done({
              content:
                "DoH · 正常\n" +
                ms + "ms\n" +
                "A · " + answer,
              icon:
                "checkmark.shield.fill",
              backgroundColor:
                "#315D38"
            });

          } else {

            $done({
              content:
                "HTTP " +
                response.status +
                "\n" +
                ms + "ms",
              icon:
                "exclamationmark.shield.fill",
              backgroundColor:
                "#8A5A20"
            });

          }

        }
      );


  # ============================================================
  # 🛡️ WebRTC
  # ============================================================

  tile-webrtc:
    interval: 86400
    payload: |

      $httpClient.get(
        "https://api64.ipify.org?format=json",
        function(error, response, data) {

          if (error || !response ||
              response.status < 200 ||
              response.status >= 300) {

            $done({
              content:
                "出口 IP 获取失败",
              icon:
                "xmark.shield.fill",
              backgroundColor:
                "#6A2B2B"
            });

            return;
          }

          try {

            var x =
              JSON.parse(data);

            var ip =
              x.ip || "Unknown";

            var type =
              ip.indexOf(":") !== -1
              ? "IPv6"
              : "IPv4";

            $done({
              content:
                type + " 出口\n" +
                ip + "\n" +
                "WebRTC 需单独复核",
              icon:
                "shield.lefthalf.filled",
              backgroundColor:
                "#4C3030"
            });

          } catch(e) {

            $done({
              content:
                "数据解析失败",
              icon:
                "xmark.shield.fill",
              backgroundColor:
                "#6A2B2B"
            });

          }

        }
      );


  # ============================================================
  # ▶️ YouTube
  # ============================================================

  tile-youtube:
    interval: 604800
    payload: |

      var start = Date.now();

      $httpClient.get(
        "https://www.youtube.com/generate_204",
