# ============================================================
# DNS
# ============================================================

dns:

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  nameserver-policy:

    "geosite:cn":
      - 223.5.5.5
      - 119.29.29.29

  follow-rule: false

  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "+.stun.*.*.*.*.*"
    - "lens.l.google.com"
    - "*.n.n.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.push.apple.com"


# ============================================================
# Script Shortcuts
# ============================================================

script:

  shortcuts:

    quic: network == 'udp' and dst_port == 443


# ============================================================
# Rules
# ============================================================

rules:

  # QUIC
  - SCRIPT,quic,REJECT


  # LAN
  - GEOIP,LAN,DIRECT


