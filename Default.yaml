script-providers: #!replace


  # ============================================================
  # 国际出口
  # ============================================================

  tile-international:
    interval: 86400
    payload: |
      var start = Date.now();

      $httpClient.get(
        "https://ipinfo.io/json",
        function(error, response, data) {

          var ms = Date.now() - start;

          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 300
          ) {

            $done({
              content:
                "✕ 出口检测失败\n" +
                "HTTP · " +
                (
                  response
                    ? response.status
                    : "连接失败"
                )
            });

            return;
          }

          try {

            var x =
              JSON.parse(data);

            $done({
              content:
                (x.ip || "Unknown") +
                "\n" +
                (x.country || "Unknown") +
                " · " +
                (x.city || "Unknown") +
                "\n" +
                (x.org || "Unknown") +
                "\n" +
                "RTT · " +
                ms +
                "ms"
            });

          } catch (e) {

            $done({
              content:
                "✕ 数据解析失败"
            });

          }

        }
      );


  # ============================================================
  # 网络控制中心
  # ============================================================

  tile-network-control:
    interval: 86400
    payload: |

      var version =
        $environment["stash-version"] ||
        "Unknown";

      var build =
        $environment["stash-build"] ||
        "Unknown";

      $done({
        content:
          "Stash · " +
          version +
          "\n" +
          "Build · " +
          build +
          "\n" +
          "Network Engine · OK"
      });


  # ============================================================
  # DNS
  #
  # 自动检测：
  #   Cloudflare DoH 实际 DNS 查询
  #
  # 手动检测：
  #   DNSLeakTest 真正执行 DNS Leak Test
  #
  # 自动查询成功 ≠ DNS 无泄漏
  # ============================================================

  tile-dns:
    interval: 86400
    payload: |

      var start =
        Date.now();

      var finished =
        false;


      function doneOnce(content) {

        if (finished) {
          return;
        }

        finished =
          true;

        $done({
          content:
            content
        });

      }


      setTimeout(function() {

        doneOnce(
          "✕ DNS 查询超时\n" +
          "DoH · Cloudflare\n" +
          "Resolver · 1.1.1.1\n" +
          "手动检测 →"
        );

      }, 6000);


      $httpClient.get(
        {
          url:
            "https://1.1.1.1/dns-query?name=example.com&type=A",

          headers: {
            "Accept":
              "application/dns-json"
          },

          timeout:
            5
        },

        function(error, response, data) {

          if (finished) {
            return;
          }

          var ms =
            Date.now() -
            start;


          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 300
          ) {

            doneOnce(
              "✕ DNS 查询失败\n" +
              "DoH · Cloudflare\n" +
              "Resolver · 1.1.1.1\n" +
              "HTTPS · " +
              (
                response
                  ? response.status
                  : "连接失败"
              ) +
              "\n" +
              "手动检测 →"
            );

            return;
          }


          try {

            var json =
              JSON.parse(data);

            var answers =
              json.Answer ||
              [];


            if (
              answers.length === 0
            ) {

              doneOnce(
                "⚠ DNS 查询无 Answer\n" +
                "DoH · Cloudflare\n" +
                "Resolver · 1.1.1.1\n" +
                "RTT · " +
                ms +
                "ms\n" +
                "手动检测 →"
              );

              return;
            }


            var first =
              answers[0];

            var ttl =
              first.TTL !== undefined
                ? first.TTL + "s"
                : "未知";


            doneOnce(
              "✓ DNS 查询正常 · " +
              ms +
              "ms\n" +
              "DoH · Cloudflare\n" +
              "Resolver · 1.1.1.1\n" +
              "A · " +
              first.data +
              "\n" +
              "Answer · " +
              answers.length +
              "\n" +
              "TTL · " +
              ttl +
              "\n" +
              "HTTPS · " +
              response.status +
              "\n" +
              "手动检测 →"
            );


          } catch (e) {

            doneOnce(
              "✕ DNS 响应解析失败\n" +
              "DoH · Cloudflare\n" +
              "HTTPS · " +
              response.status +
              "\n" +
              "手动检测 →"
            );

          }

        }
      );


  # ============================================================
  # WebRTC
  #
  # 自动：
  #   BrowserLeaks 服务可达性
  #
  # 手动：
  #   BrowserLeaks WebRTC API 实际检测
  #
  # 不伪造“无泄漏”
  # ============================================================

  tile-webrtc:
    interval: 86400
    payload: |

      var start =
        Date.now();


      $httpClient.get(
        "https://browserleaks.com/webrtc",
        function(error, response, data) {

          var ms =
            Date.now() -
            start;


          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 400
          ) {

            $done({
              content:
                "✕ 检测服务不可达\n" +
                "BrowserLeaks\n" +
                "HTTP · " +
                (
                  response
                    ? response.status
                    : "连接失败"
                ) +
                "\n" +
                "手动检测 →"
            });

            return;
          }


          $done({
            content:
              "✓ 检测服务正常 · " +
              ms +
              "ms\n" +
              "自动检测 · 服务可用\n" +
              "手动检测 →"
          });

        }
      );


  # ============================================================
  # TLS / HTTPS
  #
  # 这是 Stash Tile 能可靠取得的 TLS 信息：
  #
  # 1. 真实 HTTPS 请求
  # 2. Cloudflare 返回的 TLS 版本
  # 3. HTTP 协议
  # 4. HTTPS 状态
  # 5. Cloudflare POP
  # 6. 实际 RTT
  #
  # 不伪造 Cipher / Certificate / OCSP 等信息
  # ============================================================

  tile-tls:
    interval: 86400
    payload: |

      var start =
        Date.now();


      $httpClient.get(
        {
          url:
            "https://www.cloudflare.com/cdn-cgi/trace",

          timeout:
            5,

          insecure:
            false
        },

        function(error, response, data) {

          var ms =
            Date.now() -
            start;


          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 400
          ) {

            $done({
              content:
                "✕ TLS / HTTPS 失败\n" +
                "握手或 HTTPS 请求失败\n" +
                "RTT · " +
                ms +
                "ms"
            });

            return;
          }


          var tls =
            "Unknown";

          var http =
            "Unknown";

          var colo =
            "Unknown";

          var loc =
            "Unknown";


          if (data) {

            var tlsMatch =
              data.match(
                /(?:^|\n)tls=([^\n]+)/
              );

            var httpMatch =
              data.match(
                /(?:^|\n)http=([^\n]+)/
              );

            var coloMatch =
              data.match(
                /(?:^|\n)colo=([^\n]+)/
              );

            var locMatch =
              data.match(
                /(?:^|\n)loc=([^\n]+)/
              );


            if (tlsMatch) {
              tls =
                tlsMatch[1];
            }

            if (httpMatch) {
              http =
                httpMatch[1];
            }

            if (coloMatch) {
              colo =
                coloMatch[1];
            }

            if (locMatch) {
              loc =
                locMatch[1];
            }

          }


          $done({
            content:
              "✓ TLS / HTTPS 正常\n" +
              "TLS · " +
              tls +
              "\n" +
              "HTTP · " +
              http +
              "\n" +
              "HTTPS · " +
              response.status +
              "\n" +
              "POP · " +
              colo +
              " · " +
              loc +
              "\n" +
              "RTT · " +
              ms +
              "ms"
          });

        }
      );


  # ============================================================
  # 网络质量
  # ============================================================

  tile-network-quality:
    interval: 86400
    payload: |

      var start =
        Date.now();


      $httpClient.get(
        "https://www.cloudflare.com/cdn-cgi/trace",
        function(error, response, data) {

          var ms =
            Date.now() -
            start;


          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 400
          ) {

            $done({
              content:
                "✕ 网络质量检测失败"
            });

            return;
          }


          var colo =
            "Unknown";

          var loc =
            "Unknown";


          if (data) {

            var m1 =
              data.match(
                /(?:^|\n)colo=([^\n]+)/
              );

            var m2 =
              data.match(
                /(?:^|\n)loc=([^\n]+)/
              );


            if (m1) {
              colo =
                m1[1];
            }

            if (m2) {
              loc =
                m2[1];
            }

          }


          $done({
            content:
              "✓ HTTPS RTT · " +
              ms +
              "ms\n" +
              "POP · " +
              colo +
              " · " +
              loc
          });

        }
      );


  # ============================================================
  # QUIC / HTTP3
  #
  # 重要：
  # Stash Script $httpClient 当前不能把这个请求
  # 当作可靠的 HTTP/3 测试工具。
  #
  # 因此这里不伪造“HTTP/3 已连接”。
  # ============================================================

  tile-quic-http3:
    interval: 86400
    payload: |

      $done({
        content:
          "ℹ HTTP/3 自动检测受限\n" +
          "Stash Script HTTP Client\n" +
          "不将 HTTPS 请求冒充 HTTP/3\n" +
          "需要实际 QUIC 连接才能判定"
      });


  # ============================================================
  # 节点健康
  # ============================================================

  tile-node-health:
    interval: 86400
    payload: |

      var start =
        Date.now();


      $httpClient.get(
        "https://www.apple.com/library/test/success.html",
        function(error, response, data) {

          var ms =
            Date.now() -
            start;


          if (
            error ||
            !response
          ) {

            $done({
              content:
                "✕ 节点不可达"
            });

            return;
          }


          if (
            response.status < 200 ||
            response.status >= 400
          ) {

            $done({
              content:
                "⚠ HTTP " +
                response.status +
                " · " +
                ms +
                "ms"
            });

            return;
          }


          var level;


          if (ms < 100) {

            level =
              "优秀";

          } else if (ms < 250) {

            level =
              "良好";

          } else if (ms < 500) {

            level =
              "一般";

          } else {

            level =
              "延迟较高";

          }


          $done({
            content:
              "✓ " +
              level +
              " · " +
              ms +
              "ms"
          });

        }
      );


  # ============================================================
  # Stash 3.6
  #
  # 这里只显示真实版本 / Build。
  # 不再伪造 XHTTP / Gecko 检测结果。
  # ============================================================

  tile-stash36:
    interval: 86400
    payload: |

      var version =
        $environment["stash-version"] ||
        "Unknown";

      var build =
        $environment["stash-build"] ||
        "Unknown";


      $done({
        content:
          "Stash · " +
          version +
          "\n" +
          "Build · " +
          build +
          "\n" +
          "Runtime · " +
          (
            $environment.system ||
            "Unknown"
          )
      });


  # ============================================================
  # YouTube
  # ============================================================

  tile-youtube:
    interval: 604800
    payload: |

      var start =
        Date.now();


      $httpClient.get(
        "https://www.youtube.com/generate_204",
        function(error, response, data) {

          var ms =
            Date.now() -
            start;


          if (
            !error &&
            response &&
            response.status >= 200 &&
            response.status < 400
          ) {

            $done({
              icon:
                "checkmark",
              content:
                ms +
                "ms"
            });

          } else {

            $done({
              icon:
                "xmark",
              content:
                "不可用"
            });

          }

        }
      );


