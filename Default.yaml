script-providers: #!replace
  tile-network-quality:
    interval: 600
    payload: |
      var start = Date.now();
      var finished = false;

      function finish(content) {
        if (finished) {
          return;
        }

        finished = true;

        $done({
          content: content
        });
      }

      setTimeout(function() {
        finish(
          "✕ 节点测速超时\n" +
          "状态 · Timeout"
        );
      }, 6000);

      $httpClient.head(
        {
          url: "http://www.apple.com/",
          timeout: 5
        },

        function(error, response, data) {

          if (finished) {
            return;
          }

          var ms =
            Date.now() - start;

          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 400
          ) {

            finish(
              "✕ 节点不可用\n" +
              "状态 · Failed"
            );

            return;
          }

          var quality;

          if (ms < 80) {
            quality = "优秀";
          } else if (ms < 150) {
            quality = "良好";
          } else if (ms < 250) {
            quality = "一般";
          } else if (ms < 500) {
            quality = "较高";
          } else {
            quality = "很高";
          }

          finish(
            "✓ 节点测速正常\n" +
            "延迟 · " + ms + "ms\n" +
            "质量 · " + quality
          );
        }
      );

  tile-node-health:
    interval: 600
    payload: |
      var start = Date.now();
      var finished = false;

      function finish(content) {
        if (finished) {
          return;
        }

        finished = true;

        $done({
          content: content
        });
      }

      setTimeout(function() {
        finish(
          "✕ 当前节点异常\n" +
          "状态 · Timeout"
        );
      }, 6000);

      $httpClient.head(
        {
          url: "http://www.apple.com/",
          timeout: 5
        },

        function(error, response, data) {

          if (finished) {
            return;
          }

          var ms =
            Date.now() - start;

          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 400
          ) {

            finish(
              "✕ 当前节点异常\n" +
              "状态 · Failed"
            );

            return;
          }

          finish(
            "✓ 当前节点正常\n" +
            "延迟 · " + ms + "ms\n" +
            "状态 · Healthy"
          );
        }
      );

  tile-international:
    interval: 86400
    payload: |
      $httpClient.get(
        "https://ipinfo.io/json",
        function(error, response, data) {

          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 300
          ) {

            $done({
              content: "✕ 出口检测失败"
            });

            return;
          }

          try {

            var x = JSON.parse(data);

            $done({
              content:
                "IP · " + (x.ip || "Unknown") + "\n" +
                "位置 · " +
                (x.country || "Unknown") +
                " · " +
                (x.city || "Unknown") + "\n" +
                "ISP · " + (x.org || "Unknown")
            });

          } catch (e) {

            $done({
              content:
                "✕ 出口数据解析失败"
            });
          }
        }
      );

  tile-network-control:
    interval: 86400
    payload: |
      var version =
        $environment["stash-version"] || "Unknown";

      var build =
        $environment["stash-build"] || "Unknown";

      $done({
        content:
          "Stash · " + version + "\n" +
          "Build · " + build + "\n" +
          "Network Engine · OK"
      });

  tile-dns:
    interval: 86400
    payload: |
      var start = Date.now();
      var finished = false;

      function finish(content) {

        if (finished) {
          return;
        }

        finished = true;

        $done({
          content: content
        });
      }

      setTimeout(function() {

        finish(
          "✕ DNS 查询超时\n" +
          "DoH · Cloudflare\n" +
          "Resolver · 1.1.1.1\n" +
          "点击手动检测 →"
        );

      }, 6000);

      $httpClient.get(
        {
          url:
            "https://1.1.1.1/dns-query?name=example.com&type=A",

          headers: {
            "Accept": "application/dns-json"
          },

          timeout: 5
        },

        function(error, response, data) {

          if (finished) {
            return;
          }

          var ms =
            Date.now() - start;

          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 300
          ) {

            finish(
              "✕ DNS 查询失败\n" +
              "DoH · Cloudflare\n" +
              "Resolver · 1.1.1.1\n" +
              "点击手动检测 →"
            );

            return;
          }

          try {

            var json =
              JSON.parse(data);

            var answers =
              json.Answer || [];

            if (!answers.length) {

              finish(
                "⚠ DNS 无 Answer\n" +
                "查询 · example.com\n" +
                "耗时 · " + ms + "ms\n" +
                "点击手动检测 →"
              );

              return;
            }

            var first =
              answers[0];

            finish(
              "✓ DNS 查询正常\n" +
              "DoH · Cloudflare\n" +
              "Resolver · 1.1.1.1\n" +
              "A · " + first.data + "\n" +
              "Answer · " + answers.length + "\n" +
              "耗时 · " + ms + "ms\n" +
              "点击手动检测 →"
            );

          } catch (e) {

            finish(
              "✕ DNS 数据解析失败\n" +
              "点击手动检测 →"
            );
          }
        }
      );

  tile-webrtc:
    interval: 86400
    payload: |
      var start = Date.now();

      $httpClient.get(
        "https://browserleaks.com/webrtc",
        function(error, response, data) {

          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 400
          ) {

            $done({
              content:
                "✕ WebRTC 检测入口不可用\n" +
                "点击手动检测 →"
            });

            return;
          }

          $done({
            content:
              "✓ WebRTC 检测入口正常\n" +
              "点击手动检测 →"
          });
        }
      );

  tile-tls:
    interval: 86400
    payload: |
      var start = Date.now();

      $httpClient.get(
        "https://www.cloudflare.com/cdn-cgi/trace",
        function(error, response, data) {

          var ms =
            Date.now() - start;

          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 400
          ) {

            $done({
              content:
                "✕ TLS 检测失败"
            });

            return;
          }

          var tls = "Unknown";
          var http = "Unknown";
          var colo = "Unknown";

          if (data) {

            var a =
              data.match(/(?:^|\n)tls=([^\n]+)/);

            var b =
              data.match(/(?:^|\n)http=([^\n]+)/);

            var c =
              data.match(/(?:^|\n)colo=([^\n]+)/);

            if (a) {
              tls = a[1];
            }

            if (b) {
              http = b[1];
            }

            if (c) {
              colo = c[1];
            }
          }

          $done({
            content:
              "✓ TLS 正常\n" +
              "TLS · " + tls + "\n" +
              "HTTP · " + http + "\n" +
              "POP · " + colo + "\n" +
              "代理链路 · " + ms + "ms"
          });
        }
      );

  tile-quic-http3:
    interval: 86400
    payload: |
      var start = Date.now();

      $httpClient.get(
        "https://cloudflare-quic.com/",
        function(error, response, data) {

          var ms =
            Date.now() - start;

          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 400
          ) {

            $done({
              content:
                "✕ HTTP/3 端点不可用\n" +
                "状态 · Failed\n" +
                "代理链路 · " + ms + "ms"
            });

            return;
          }

          var alt = "";

          try {

            if (response.headers) {

              alt =
                response.headers["alt-svc"] ||
                response.headers["Alt-Svc"] ||
                "";
            }

          } catch (e) {}

          if (
            alt &&
            alt.toLowerCase().indexOf("h3") !== -1
          ) {

            $done({
              content:
                "✓ HTTP/3 端点可用\n" +
                "状态 · OK\n" +
                "代理链路 · " + ms + "ms\n" +
                "Alt-Svc · h3"
            });

          } else {

            $done({
              content:
                "⚠ HTTP/3 未确认\n" +
                "状态 · OK\n" +
                "代理链路 · " + ms + "ms\n" +
                "Alt-Svc · 未发现 h3"
            });
          }
        }
      );

  tile-youtube:
    interval: 604800
    payload: |
      var start = Date.now();

      $httpClient.get(
        "https://www.youtube.com/generate_204",
        function(error, response, data) {

