script-providers: #!replace

  tile-international:
    interval: 86400
    payload: |
      var start = Date.now();
      $httpClient.get('https://ipinfo.io/json', function(error, response, data) {
        if (error || !response || !data) {
          $done({content: '🔴 出口检测失败'});
          return;
        }
        try {
          var x = JSON.parse(data);
          $done({
            content:
              'IP  ' + (x.ip || '未知') + '\n' +
              '国家  ' + (x.country || '未知') + '\n' +
              '城市  ' + (x.city || '未知') + '\n' +
              'ASN  ' + (x.org || '未知') + '\n' +
              '⚡ ' + (Date.now() - start) + ' ms'
          });
        } catch(e) {
          $done({content: '🔴 数据解析失败'});
        }
      });

  
  tile-node-health:
    interval: 86400
    payload: |
      var start = Date.now();

      $httpClient.get('https://www.google.com/generate_204', function(error, response, data) {
        if (error || !response) {
          $done({content: '🔴 请求失败\n健康度 0/100'});
          return;
        }

        var ms = Date.now() - start;
        var score = 100;

        if (ms > 100) score -= 5;
        if (ms > 200) score -= 10;
        if (ms > 400) score -= 20;
        if (ms > 800) score -= 25;

        var level =
          score >= 90 ? '优秀' :
          score >= 75 ? '良好' :
          score >= 60 ? '一般' : '较差';

        $done({
          content:
            '🟢 在线\n' +
            '延迟  ' + ms + ' ms\n' +
            '健康度  ' + score + '/100\n' +
            level
        });
      });

  tile-network-quality:
    interval: 86400
    payload: |
      var start = Date.now();

      $httpClient.get('https://www.cloudflare.com/cdn-cgi/trace', function(error, response, data) {
        if (error || !response) {
          $done({content: '🔴 网络检测失败'});
          return;
        }

        var ms = Date.now() - start;

        var level =
          ms < 100 ? '优秀' :
          ms < 200 ? '良好' :
          ms < 400 ? '一般' : '较差';

        $done({
          content:
            'RTT  ' + ms + ' ms\n' +
            'HTTPS  🟢\n' +
            '质量  ' + level
        });
      });

  tile-quic-http3:
    interval: 86400
    payload: |
      var start = Date.now();

      $httpClient.get('https://www.cloudflare.com/cdn-cgi/trace', function(error, response, data) {

        if (error || !response || !data) {
          $done({
            content: '🔴 QUIC / HTTP3 检测失败'
          });
          return;
        }

        var http = '未知';
        var tls = '未知';
        var lines = data.split('\n');

        for (var i = 0; i < lines.length; i++) {
          if (lines[i].indexOf('http=') === 0) {
            http = lines[i].substring(5).trim();
          }

          if (lines[i].indexOf('tls=') === 0) {
            tls = lines[i].substring(4).trim();
          }
        }

        var ms = Date.now() - start;

        if (http === '3') {
          $done({
            content:
              '🟢 HTTP/3 已启用\n' +
              'QUIC  🟢\n' +
              'TLS  ' + tls + '\n' +
              '⚡ ' + ms + ' ms'
          });
        } else if (http === '2') {
          $done({
            content:
              '🟡 HTTP/2\n' +
              'QUIC  ⚪ 未使用\n' +
              'TLS  ' + tls + '\n' +
              '⚡ ' + ms + ' ms'
          });
        } else {
          $done({
            content:
              '⚠️ HTTP/' + http + '\n' +
              'QUIC  ⚪ 未使用\n' +
              'TLS  ' + tls + '\n' +
              '⚡ ' + ms + ' ms'
          });
        }
      });

  tile-dns:
    interval: 86400
    payload: |
      var start = Date.now();

      $httpClient.get({
        url: 'https://cloudflare-dns.com/dns-query?name=example.com&type=A',
        headers: {
          'Accept': 'application/dns-json'
        }
      }, function(error, response, data) {

        if (error || !response || !data) {
          $done({content: '🔴 DNS 请求失败'});
          return;
        }

        try {
          var x = JSON.parse(data);

          if (x.Status === 0 && x.Answer) {
            $done({
              content:
                '🟢 DNS 正常\n' +
                '解析成功\n' +
                '⚡ ' + (Date.now() - start) + ' ms'
            });
          } else {
            $done({
              content: '⚠️ DNS 异常\nStatus ' + x.Status
            });
          }
        } catch(e) {
          $done({content: '⚠️ DNS 数据解析失败'});
        }
      });

  tile-tls:
    interval: 86400
    payload: |
      $httpClient.get('https://www.cloudflare.com/cdn-cgi/trace', function(error, response, data) {

        if (error || !response || !data) {
          $done({content: '🔴 TLS 检测失败'});
          return;
        }

        var tls = '未知';
        var http = '未知';
        var lines = data.split('\n');

        for (var i = 0; i < lines.length; i++) {
          if (lines[i].indexOf('tls=') === 0) {
            tls = lines[i].substring(4);
          }

          if (lines[i].indexOf('http=') === 0) {
            http = lines[i].substring(5);
          }
        }

        $done({
          content:
            'TLS  ' + tls + '\n' +
            'HTTP  ' + http + '\n' +
            'HTTPS  🟢'
        });
      });

  tile-current-ip:
    interval: 86400
    payload: |
      $httpClient.get('https://api.ipify.org', function(error, response, data) {
        if (error || !response || !data) {
          $done({content: '🔴 获取失败'});
          return;
        }

        $done({
          content: '🟢 ' + data.trim()
        });
      });

  tile-cn-intl:
    interval: 86400
    payload: |
      var finished = 0;
      var cn = false;
      var intl = false;

      function finish() {
        finished++;

        if (finished !== 2) return;

        $done({
          content:
            '国内  ' + (cn ? '🟢 正常' : '🔴 失败') + '\n' +
            '国际  ' + (intl ? '🟢 正常' : '🔴 失败')
        });
      }

      $httpClient.get('https://www.baidu.com', function(error, response, data) {
        cn = !error && !!response;
        finish();
      });

      $httpClient.get('https://www.google.com/generate_204', function(error, response, data) {
        intl = !error && !!response;
        finish();
      });

  tile-ipv6:
    interval: 86400
    payload: |
      $httpClient.get('https://api6.ipify.org?format=json', function(error, response, data) {

        if (!error && response && response.status === 200 && data) {
          try {
            var x = JSON.parse(data);

            if (x.ip) {
              $done({
                content:
                  '🟢 IPv6 已启用\n' +
                  x.ip
              });
              return;
            }
          } catch(e) {}
        }

        $done({
          content: '⚪ 未检测到 IPv6'
        });
      });

  tile-google:
    interval: 604800
    payload: |
      var start = Date.now();

      $httpClient.get('https://www.google.com/generate_204', function(error, response, data) {

        if (error || !response) {
          $done({content: '🔴 不可访问'});
          return;
        }

        $done({
          content:
            (response.status === 204 ? '🟢 正常' : '⚠️ HTTP ' + response.status) +
            '\n⚡ ' + (Date.now() - start) + ' ms'
        });
      });

  tile-youtube:
    interval: 604800
