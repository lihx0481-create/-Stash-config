# ============================================================
# DNS
# ============================================================

dns:

  default-nameserver:
    - 1.1.1.1
    - 223.5.5.5

  nameserver:
    - https://1.1.1.1/dns-query
    - https://223.5.5.5/dns-query

  follow-rule: false

  skip-cert-verify: false

  nameserver-policy:

    # 中国大陆
    "geosite:cn":
      - https://223.5.5.5/dns-query

    # Apple
    "geosite:apple":
      - https://1.1.1.1/dns-query

    # Google
    "geosite:google":
      - https://1.1.1.1/dns-query

    # YouTube
    "geosite:youtube":
      - https://1.1.1.1/dns-query

    # Telegram
    "geosite:telegram":
      - https://1.1.1.1/dns-query

    # Twitter / X
    "geosite:twitter":
      - https://1.1.1.1/dns-query

    # Facebook
    "geosite:facebook":
      - https://1.1.1.1/dns-query

    # GitHub
    "geosite:github":
      - https://1.1.1.1/dns-query


  # ==========================================================
  # Fake IP Filter
  # ==========================================================

  fake-ip-filter:

    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "+.stun.*.*.*.*.*"

    - "lens.l.google.com"

    - "*.n.n.srv.nintendo.net"

    - "+.stun.playstation.net"

    - "+.stun.xboxlive.com"

    - "+.stun.services.mozilla.com"

    - "+.stun.cloudflare.com"


# ============================================================
# Script
# ============================================================

script:

  shortcuts:

    # 拒绝 QUIC / HTTP3 UDP
    quic: network == 'udp' and (dst_port == 443 or dst_port == 4483 or dst_port == 9305)


# ============================================================
# Rules
# ============================================================

rules:


  # ==========================================================
  # QUIC
  # ==========================================================

  - SCRIPT,quic,REJECT


  # ==========================================================
  # LAN
  # ==========================================================

  - GEOIP,LAN,DIRECT


  # ==========================================================
  # Apple
  # ==========================================================

  - DOMAIN-SUFFIX,apple.com,Apple
  - DOMAIN-SUFFIX,icloud.com,Apple
  - DOMAIN-SUFFIX,icloud-content.com,Apple
  - DOMAIN-SUFFIX,apple-cloudkit.com,Apple
  - DOMAIN-SUFFIX,mzstatic.com,Apple
  - DOMAIN-SUFFIX,itunes.apple.com,Apple
  - DOMAIN-SUFFIX,appstore.com,Apple


  # ==========================================================
  # Apple Push Notification Service
  #
  # APNs 保持 DIRECT
  #
  # Apple 推送使用这些域名时不会进入代理。
  # ==========================================================

  - DOMAIN-SUFFIX,push.apple.com,DIRECT
  - DOMAIN-SUFFIX,api.push.apple.com,DIRECT
  - DOMAIN-SUFFIX,feedback.push.apple.com,DIRECT
  - DOMAIN-SUFFIX,feedback.push.apple.com,DIRECT
  - DOMAIN-SUFFIX,courier.push.apple.com,DIRECT
  - DOMAIN-SUFFIX,iphone-ld.apple.com,DIRECT
  - DOMAIN-SUFFIX,lcdn-locator.apple.com,DIRECT
  - DOMAIN-SUFFIX,lcdn-registration.apple.com,DIRECT


  # ==========================================================
  # YouTube
  # ==========================================================

  - GEOSITE,youtube,YouTube


  # ==========================================================
  # Google
  # ==========================================================

  - GEOSITE,google,Google


  # ==========================================================
  # Netflix
  # ==========================================================

  - GEOSITE,netflix,Netflix


  # ==========================================================
  # Disney+
  # ==========================================================

  - GEOSITE,disney,Disney+


  # ==========================================================
  # Spotify
  # ==========================================================

  - GEOSITE,spotify,Spotify


  # ==========================================================
  # Telegram
  # ==========================================================

  - GEOSITE,telegram,Telegram


  # ==========================================================
  # GitHub
  # ==========================================================

  - GEOSITE,github,GitHub


  # ==========================================================
  # X / Twitter
  # ==========================================================

  - GEOSITE,twitter,X


  # ==========================================================
  # Instagram
  # ==========================================================

  - GEOSITE,instagram,Instagram


  # ==========================================================
  # Facebook
  # ==========================================================

  - GEOSITE,facebook,Facebook


  # ==========================================================
  # TikTok
  # ==========================================================

  - GEOSITE,tiktok,TikTok


  # ==========================================================
  # Microsoft
  # ==========================================================

  - GEOSITE,microsoft@cn,DIRECT
  - GEOSITE,microsoft,Microsoft


  # ==========================================================
  # Xbox
  # ==========================================================

  - GEOSITE,xbox,Xbox


  # ==========================================================
  # Steam
  # ==========================================================

  - GEOSITE,steam@cn,DIRECT
  - GEOSITE,steam,Steam


  # ==========================================================
  # Speedtest
  # ==========================================================

  - GEOSITE,speedtest,Speedtest


  # ==========================================================
  # AI
  # ==========================================================

  # OpenAI
  - DOMAIN-SUFFIX,openai.com,AI
  - DOMAIN-SUFFIX,chatgpt.com,AI
  - DOMAIN-SUFFIX,oaistatic.com,AI
