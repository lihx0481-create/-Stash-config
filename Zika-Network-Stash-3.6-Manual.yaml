  # ==========================================================
  # TLS
  # ==========================================================

  tile-tls:
    interval: 86400
    payload: |

      var start = Date.now();

      $httpClient.get(
        "https://www.cloudflare.com/cdn-cgi/trace",

        function(error, response, data) {

          var ms = Date.now() - start;

          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 400
          ) {

            $done({
              content:
                "✕ TLS 检测失败",
              icon: "xmark"
            });

            return;
          }

          var tls = "Unknown";
          var http = "Unknown";
          var colo = "Unknown";

          if (data) {

            var a =
              data.match(/(?:^|\n)tls=([^\n]+)/);

            var b =
              data.match(/(?:^|\n)http=([^\n]+)/);

            var c =
              data.match(/(?:^|\n)colo=([^\n]+)/);

            if (a) tls = a[1];
            if (b) http = b[1];
            if (c) colo = c[1];

          }

          $done({
            content:
              "✓ TLS 正常\n" +
              "TLS · " + tls + "\n" +
              "HTTP · " + http + "\n" +
              "POP · " + colo + "\n" +
              "链路 · " + ms + "ms",
            icon: "checkmark"
          });

        }
      );


  # ==========================================================
  # HTTP/3
  # ==========================================================

  tile-http3:
    interval: 86400
    payload: |

      var start = Date.now();

      $httpClient.get(
        "https://cloudflare-quic.com/",

        function(error, response, data) {

          var ms = Date.now() - start;

          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 400
          ) {

            $done({
              content:
                "✕ HTTP/3 端点不可用\n" +
                "链路 · " + ms + "ms",
              icon: "xmark"
            });

            return;
          }

          var alt = "";

          try {

            if (response.headers) {

              alt =
                response.headers["alt-svc"] ||
                response.headers["Alt-Svc"] ||
                "";

            }

          } catch (e) {}

          if (
            alt &&
            alt.toLowerCase().indexOf("h3") !== -1
          ) {

            $done({
              content:
                "✓ HTTP/3 可用\n" +
                "链路 · " + ms + "ms\n" +
                "Alt-Svc · h3",
              icon: "checkmark"
            });

          } else {

            $done({
              content:
                "⚠ HTTP/3 未确认\n" +
                "链路 · " + ms + "ms",
              icon: "exclamationmark.triangle"
            });

          }

        }
      );


