name: Zika Nexus Manual

# ============================================================
# Zika Nexus Manual
# Stash 3.6.x
#
# 手动节点版
#
# 特点：
# 1. 不使用订阅
# 2. 不自动识别国家
# 3. 不使用国家策略组
# 4. 节点全部手动添加
# 5. 自动选择只测速手动添加的节点
# 6. 中国大陆直连
# 7. 国际服务代理
# 8. Apple / APNs
# 9. DNS / QUIC / Tiles
#
# GitHub：
# https://github.com/lihx0481-create/-Stash-config
#
# Raw：
# https://raw.githubusercontent.com/lihx0481-create/-Stash-config/main/Zika-Network-Stash-3.6-Manual.yaml
# ============================================================


# ============================================================
# 基础
# ============================================================

mode: rule

log-level: warning

ipv6: true


# ============================================================
# 手动节点
#
# 你只需要修改这里。
#
# 不需要填写国家。
# 不需要填写节点组。
# 不需要填写订阅。
#
# 支持：
# socks5
# http
# https
#
# 如果节点不需要用户名密码：
# 删除 username / password 即可。
# ============================================================

proxies:

  # ----------------------------------------------------------
  # 示例节点 01
  # ----------------------------------------------------------
  #
  # - name: 节点 01
  #   type: socks5
  #   server: 1.2.3.4
  #   port: 1080
  #   username: username
  #   password: password


  # ----------------------------------------------------------
  # 示例节点 02
  # ----------------------------------------------------------
  #
  # - name: 节点 02
  #   type: http
  #   server: 1.2.3.5
  #   port: 8080
  #   username: username
  #   password: password


  # ----------------------------------------------------------
  # 你自己的节点从这里开始添加
  # ----------------------------------------------------------


# ============================================================
# Proxy Groups
# ============================================================

proxy-groups:


  # ==========================================================
  # 主入口
  # ==========================================================

  - name: 选择代理
    type: select
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Proxy.png
    proxies:
      - 自动选择
      - 手动选择
      - DIRECT


  # ==========================================================
  # 默认
  # ==========================================================

  - name: 默认
    type: select
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Final.png
    proxies:
      - 选择代理
      - DIRECT


  # ==========================================================
  # 自动选择
  #
  # 只会使用 proxies:
  # 里面手动添加的节点
  #
  # 不识别国家
  # 不读取订阅
  # ==========================================================

  - name: 自动选择
    type: url-test
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Auto.png
    include-all: true
    interval: 300
    tolerance: 100
    lazy: true


  # ==========================================================
  # 手动选择
  #
  # 只显示你自己添加的节点
  # ==========================================================

