# ============================================================
# DNS
# ============================================================

dns:

  # 仅用于解析 DNS 服务自身
  # 使用 IP，因此不需要再次解析 DNS 域名
  default-nameserver:
    - 1.1.1.1
    - 223.5.5.5

  # 普通 DNS 请求全部使用加密 DNS
  nameserver:
    - https://1.1.1.1/dns-query
    - https://223.5.5.5/dns-query

  # 不让 DNS 跟随代理规则
  # 避免代理 DNS 产生递归解析问题
  follow-rule: false

  # 正常验证 DoH 证书
  skip-cert-verify: false

  # 国内域名
  # 使用加密国内 DNS
  #
  # 国际服务继续使用 Cloudflare DoH
  nameserver-policy:

    "geosite:cn":
      - https://223.5.5.5/dns-query

    "geosite:apple":
      - https://1.1.1.1/dns-query

    "geosite:google":
      - https://1.1.1.1/dns-query

    "geosite:youtube":
      - https://1.1.1.1/dns-query

    "geosite:telegram":
      - https://1.1.1.1/dns-query

    "geosite:twitter":
      - https://1.1.1.1/dns-query

    "geosite:facebook":
      - https://1.1.1.1/dns-query

    "geosite:github":
      - https://1.1.1.1/dns-query

  # ==========================================================
  # Fake IP 排除
  # ==========================================================

  fake-ip-filter:

    # STUN
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "+.stun.*.*.*.*.*"

    # Google Voice
    - "lens.l.google.com"

    # Nintendo
    - "*.n.n.srv.nintendo.net"

    # PlayStation
    - "+.stun.playstation.net"

    # Xbox
    - "+.stun.xboxlive.com"

    # Mozilla
    - "+.stun.services.mozilla.com"

    # Cloudflare
    - "+.stun.cloudflare.com"


# ============================================================
# Script Shortcuts
# ============================================================

script:

  shortcuts:

    # HTTP/3 / QUIC
    #
    # 443
    # Bilibili 常见 4483
    # Bilibili 常见 9305
    #
    # 对部分代理协议可提高稳定性
    quic: network == 'udp' and (dst_port == 443 or dst_port == 4483 or dst_port == 9305)


