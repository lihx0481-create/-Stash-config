  # ==========================================================
  # Google
  # ==========================================================

  tile-google:
    interval: 604800
    payload: |

      var start = Date.now();

      $httpClient.get(
        "https://www.google.com/generate_204",

        function(error, response, data) {

          var ms = Date.now() - start;

          if (
            !error &&
            response &&
            response.status >= 200 &&
            response.status < 400
          ) {

            $done({
              content:
                "✓ 可用 · " + ms + "ms",
              icon: "checkmark"
            });

          } else {

            $done({
              content:
                "✕ 不可用",
              icon: "xmark"
            });

          }

        }
      );


