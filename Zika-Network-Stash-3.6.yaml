# ============================================================
# DNS
# ============================================================

dns:

  default-nameserver:
    - 1.1.1.1
    - 223.5.5.5

  nameserver:
    - https://1.1.1.1/dns-query
    - https://223.5.5.5/dns-query

  follow-rule: false

  skip-cert-verify: false

  nameserver-policy:

    "geosite:cn":
      - https://223.5.5.5/dns-query

    "geosite:apple":
      - https://1.1.1.1/dns-query

    "geosite:google":
      - https://1.1.1.1/dns-query

    "geosite:youtube":
      - https://1.1.1.1/dns-query

    "geosite:telegram":
      - https://1.1.1.1/dns-query

    "geosite:twitter":
      - https://1.1.1.1/dns-query

    "geosite:facebook":
      - https://1.1.1.1/dns-query

    "geosite:github":
      - https://1.1.1.1/dns-query

  fake-ip-filter:

    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "+.stun.*.*.*.*.*"

    - "lens.l.google.com"

    - "*.n.n.srv.nintendo.net"

    - "+.stun.playstation.net"

    - "+.stun.xboxlive.com"

    - "+.stun.services.mozilla.com"

    - "+.stun.cloudflare.com"


# ============================================================
# Script Shortcuts
# ============================================================

script:

  shortcuts:

    quic: network == 'udp' and (dst_port == 443 or dst_port == 4483 or dst_port == 9305)


