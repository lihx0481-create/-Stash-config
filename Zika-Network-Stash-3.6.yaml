name: Zika Nexus

# ============================================================
# Zika Nexus
# Universal Stash 3.6.x Public Configuration
#
# 国家自动识别
# 自动选择 / 手动选择
# 软件独立策略组
# DNS / QUIC / Tiles
#
# URL 保持不变：
# https://link.stash.ws/install-config/raw.githubusercontent.com/lihx0481-create/-Stash-config/main/Zika-Network-Stash-3.6.yaml
# ============================================================


# ============================================================
# 基础
# ============================================================

mode: rule

log-level: warning

ipv6: true


# ============================================================
# Proxy Groups
# ============================================================

proxy-groups:


  # ==========================================================
  # 主入口
  # ==========================================================

  - name: 选择代理
    type: select
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Proxy.png
    proxies:
      - 自动选择
      - 手动选择
      - HK 香港
      - TW 台湾
      - SG 新加坡
      - JP 日本
      - KR 韩国
      - US 美国
      - CA 加拿大
      - GB 英国
      - DE 德国
      - FR 法国
      - AU 澳大利亚
      - NL 荷兰
      - CH 瑞士
      - IT 意大利
      - ES 西班牙
      - SE 瑞典
      - PL 波兰
      - MY 马来西亚
      - TH 泰国
      - VN 越南
      - PH 菲律宾
      - ID 印尼
      - IN 印度
      - AE 阿联酋
      - TR 土耳其
      - BR 巴西
      - MX 墨西哥
      - NZ 新西兰
      - RU 俄罗斯
      - 其他地区
      - DIRECT


  # ==========================================================
  # 默认
  # ==========================================================

  - name: 默认
    type: select
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Final.png
    proxies:
      - 选择代理
      - 自动选择
      - 手动选择
      - DIRECT


  # ==========================================================
  # 自动选择
  #
  # 核心改变：
  # 不再只使用 include-all。
  #
  # 自动选择会直接测试各国家策略组，
  # 国家策略组再测试该国家的实际节点。
  #
  # 结构：
  #
  # 自动选择
  #   ↓
  # 国家策略组
  #   ↓
  # 实际节点
  # ==========================================================

  - name: 自动选择
    type: url-test
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Auto.png
    proxies:
      - HK 香港
      - TW 台湾
      - SG 新加坡
      - JP 日本
      - KR 韩国
      - US 美国
      - CA 加拿大
      - GB 英国
