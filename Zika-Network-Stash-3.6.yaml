# ============================================================
# Tile Scripts
# ============================================================

script-providers:


  # ==========================================================
  # 网络质量
  # ==========================================================

  tile-network-quality:
    interval: 600
    payload: |

      var start = Date.now();

      $httpClient.head(
        {
          url: "https://www.apple.com/",
          timeout: 5
        },

        function(error, response, data) {

          var ms = Date.now() - start;

          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 400
          ) {

            $done({
              content:
                "✕ 网络不可用\n" +
                "状态 · Failed",
              icon: "xmark"
            });

            return;
          }

          var quality = "较高";

          if (ms < 80) {
            quality = "优秀";
          } else if (ms < 150) {
            quality = "良好";
          } else if (ms < 250) {
            quality = "一般";
          }

          $done({
            content:
              "✓ 网络正常\n" +
              "延迟 · " + ms + "ms\n" +
              "质量 · " + quality,
            icon: "checkmark"
          });

        }
      );


  # ==========================================================
  # 节点健康
  # ==========================================================

  tile-node-health:
    interval: 600
    payload: |

      var start = Date.now();

      $httpClient.head(
        {
          url: "https://www.apple.com/",
          timeout: 5
        },

        function(error, response, data) {

          var ms = Date.now() - start;

          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 400
          ) {

            $done({
              content:
                "✕ 当前节点异常\n" +
                "状态 · Failed",
              icon: "xmark"
            });

            return;
          }

          $done({
            content:
              "✓ 当前节点正常\n" +
              "延迟 · " + ms + "ms\n" +
              "状态 · Healthy",
            icon: "checkmark"
          });

        }
      );


  # ==========================================================
  # 国际出口
  # ==========================================================

  tile-international:
    interval: 86400
    payload: |

      $httpClient.get(
        "https://ipinfo.io/json",
        function(error, response, data) {

          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 300
          ) {

            $done({
              content:
                "✕ 出口检测失败",
              icon: "xmark"
            });

            return;
          }

          try {

            var x = JSON.parse(data);

            $done({
              content:
                "✓ 国际出口\n" +
                "IP · " + (x.ip || "Unknown") + "\n" +
                "地区 · " +
                (x.country || "Unknown") +
                " · " +
                (x.city || "Unknown") + "\n" +
                "ISP · " +
                (x.org || "Unknown"),
              icon: "checkmark"
            });

          } catch (e) {

            $done({
              content:
                "✕ 出口数据解析失败",
              icon: "xmark"
            });

          }

        }
      );


  # ==========================================================
  # 网络控制中心
  # ==========================================================

  tile-network-control:
    interval: 86400
    payload: |

      var version =
        $environment["stash-version"] || "Unknown";

      var build =
        $environment["stash-build"] || "Unknown";

      $done({
        content:
          "Stash · " + version + "\n" +
          "Build · " + build + "\n" +
          "Network Engine · OK",
        icon: "checkmark"
      });


  # ==========================================================
  # DNS
  # ==========================================================

  tile-dns:
    interval: 86400
    payload: |

      var start = Date.now();

      $httpClient.get(
        {
          url:
            "https://1.1.1.1/dns-query?name=example.com&type=A",

          headers: {
            "Accept": "application/dns-json"
          },

          timeout: 5
        },

        function(error, response, data) {

          var ms = Date.now() - start;

          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 300
          ) {

            $done({
              content:
                "✕ DoH 查询失败\n" +
                "Resolver · Cloudflare\n" +
                "1.1.1.1",
              icon: "xmark"
            });

            return;
          }

          try {

            var json = JSON.parse(data);

            var answers =
              json.Answer || [];

            if (!answers.length) {

              $done({
                content:
                  "⚠ DNS 无 Answer\n" +
                  "查询 · example.com\n" +
                  "耗时 · " + ms + "ms",
                icon: "exclamationmark.triangle"
              });

              return;
            }

            $done({
              content:
                "✓ DoH 正常\n" +
                "Resolver · Cloudflare\n" +
                "A · " + answers[0].data + "\n" +
                "Answer · " + answers.length + "\n" +
                "耗时 · " + ms + "ms",
              icon: "checkmark"
            });

          } catch (e) {

            $done({
              content:
                "✕ DNS 数据解析失败",
              icon: "xmark"
            });

          }

        }
      );


  # ==========================================================
  # WebRTC
  # ==========================================================

  tile-webrtc:
    interval: 86400
    payload: |

      $httpClient.get(
        "https://browserleaks.com/webrtc",

        function(error, response, data) {

          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 400
          ) {

            $done({
              content:
                "✕ WebRTC 检测入口不可用\n" +
                "点击手动检测 →",
              icon: "xmark"
            });

            return;
          }

          $done({
            content:
              "✓ 检测入口正常\n" +
              "点击手动检测 →",
            icon: "checkmark"
          });

        }
      );


  # ==========================================================
  # TLS
  # ==========================================================

  tile-tls:
    interval: 86400
    payload: |

      var start = Date.now();

      $httpClient.get(
        "https://www.cloudflare.com/cdn-cgi/trace",

        function(error, response, data) {

          var ms = Date.now() - start;

          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 400
          ) {

            $done({
              content:
                "✕ TLS 检测失败",
              icon: "xmark"
            });

            return;
          }

          var tls = "Unknown";
          var http = "Unknown";
          var colo = "Unknown";

          if (data) {

            var a =
              data.match(/(?:^|\n)tls=([^\n]+)/);

            var b =
              data.match(/(?:^|\n)http=([^\n]+)/);

            var c =
              data.match(/(?:^|\n)colo=([^\n]+)/);

            if (a) {
              tls = a[1];
            }

            if (b) {
              http = b[1];
            }

            if (c) {
              colo = c[1];
            }

          }

          $done({
            content:
              "✓ TLS 正常\n" +
              "TLS · " + tls + "\n" +
              "HTTP · " + http + "\n" +
              "POP · " + colo + "\n" +
              "链路 · " + ms + "ms",
            icon: "checkmark"
          });

        }
      );


  # ==========================================================
  # HTTP/3
  # ==========================================================

  tile-http3:
    interval: 86400
    payload: |

      var start = Date.now();

      $httpClient.get(
        "https://cloudflare-quic.com/",

        function(error, response, data) {

          var ms = Date.now() - start;

          if (
            error ||
            !response ||
            response.status < 200 ||
            response.status >= 400
          ) {

            $done({
              content:
                "✕ HTTP/3 端点不可用\n" +
                "链路 · " + ms + "ms",
              icon: "xmark"
            });

            return;
          }

          var alt = "";

          try {

            if (response.headers) {

              alt =
                response.headers["alt-svc"] ||
                response.headers["Alt-Svc"] ||
                "";

            }

          } catch (e) {}

          if (
            alt &&
            alt.toLowerCase().indexOf("h3") !== -1
          ) {

            $done({
              content:
                "✓ HTTP/3 可用\n" +
                "链路 · " + ms + "ms\n" +
                "Alt-Svc · h3",
              icon: "checkmark"
            });

          } else {

            $done({
              content:
                "⚠ HTTP/3 未确认\n" +
                "链路 · " + ms + "ms",
              icon: "exclamationmark.triangle"
            });

          }

        }
      );


  # ==========================================================
  # YouTube
  # ==========================================================

  tile-youtube:
    interval: 604800
    payload: |

      var start = Date.now();

      $httpClient.get(
        "https://www.youtube.com/generate_204",

