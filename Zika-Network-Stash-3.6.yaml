name: Zika Nexus

# ============================================================
# Zika Nexus
# Universal Stash 3.6.x Public Configuration
#
# 公共主配置
#
# ✓ 不内置机场订阅
# ✓ 不内置去广告
# ✓ 用户自行添加 Proxy Provider
# ✓ 自动将用户节点加入策略组
# ✓ 根据节点名称自动地区分类
# ✓ 软件 / 服务独立分流
# ✓ DNS 优化
# ✓ QUIC / HTTP3 控制
# ✓ 网络状态 Tiles
#
# 去广告请使用独立 .stoverride
# ============================================================


# ============================================================
# 基础
# ============================================================

mode: rule

log-level: warning

ipv6: true


# ============================================================
# Proxy Providers
#
# 本配置故意不写死任何机场。
#
# 用户导入后：
#
# Stash
# → 配置
# → 代理 / Proxy Provider
# → 添加自己的机场订阅
#
# 由于策略组使用 include-all: true，
# 添加的节点会自动进入相关策略组。
#
# ============================================================

# proxy-providers:
#
#   example:
#     url: https://example.com/subscription
#     interval: 3600


# ============================================================
# Proxy Groups
# ============================================================

proxy-groups:


  # ==========================================================
  # 主入口
  # ==========================================================

  - name: 选择代理
    type: select
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Proxy.png
    proxies:
      - 自动选择
      - 手动选择

      - HK 香港
      - TW 台湾
      - SG 新加坡
      - JP 日本
      - KR 韩国
      - US 美国
      - CA 加拿大
      - GB 英国
      - DE 德国
      - FR 法国
      - AU 澳大利亚

      - NL 荷兰
      - CH 瑞士
      - IT 意大利
      - ES 西班牙
      - SE 瑞典
      - PL 波兰

      - MY 马来西亚
      - TH 泰国
      - VN 越南
      - PH 菲律宾
      - ID 印尼

      - IN 印度
      - AE 阿联酋
      - TR 土耳其
      - BR 巴西
      - MX 墨西哥
      - NZ 新西兰
      - RU 俄罗斯

      - 其他地区
      - DIRECT


  # ==========================================================
  # 默认
  # ==========================================================

  - name: 默认
    type: select
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Final.png
    proxies:
      - 选择代理
      - 自动选择
      - DIRECT


  # ==========================================================
  # 自动选择
